org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod Properties
mod_id=stockkeeperbookmarks
# Jar filename only. Hyphenated and loader-tagged for the download list, where mod_id's
# runtime spelling would tell a browsing user nothing about what loader this is for.
# build.gradle appends minecraft_version and mod_version, so the filename tracks both
# without this needing to be edited on a version bump.
archives_name=stock-keeper-bookmarks-neoforge
mod_name=Create: Stock Keeper Bookmarks
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.stockkeeperbookmarks
mod_authors=Corentin
mod_url=https://github.com/Guybrrush/stock-keeper-bookmarks
mod_issues=https://github.com/Guybrrush/stock-keeper-bookmarks/issues

# Create — must match the version range in neoforge.mods.toml
create_version=6.0.10-280
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
