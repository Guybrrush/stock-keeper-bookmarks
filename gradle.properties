# ForgeGradle decompiles Minecraft on first run and wants more headroom than moddev did.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)

## Mod Properties
mod_id=stockkeeperbookmarks
# Jar filename only. Hyphenated and loader-tagged for the download list, where mod_id's
# runtime spelling would tell a browsing user nothing about what loader this is for.
# build.gradle appends minecraft_version and mod_version, so the filename tracks both
# without this needing to be edited on a version bump.
archives_name=stock-keeper-bookmarks-forge
mod_name=Create: Stock Keeper Bookmarks
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=com.stockkeeperbookmarks
mod_authors=Guybrrush
mod_url=https://github.com/Guybrrush/stock-keeper-bookmarks
mod_issues=https://github.com/Guybrrush/stock-keeper-bookmarks/issues

# Create — must match the version range in mods.toml.
# Artifact names on this line are capitalised and MC-suffixed, unlike the 1.21.1 branch's.
create_version=6.0.8-291
ponder_version=1.0.92
catnip_version=0.8.44
flywheel_version=1.0.6-281
registrate_version=MC1.20-1.3.11
