name: Build

# Every branch here targets a different Minecraft version and loader, and each
# carries its own JDK and Gradle version, so each one builds itself.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle dependency store between runs. Besides being faster, it
      # shrinks the window in which a flaky maven can fail the build at all.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # maven.createmod.net has been seen dropping TLS handshakes against automated
      # builds. Retrying blindly would also paper over real compile errors, so this
      # retries only when the log shows an actual transport or resolution failure —
      # a genuine build break still fails on the first attempt.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew build --stacktrace 2>&1 | tee build.log; then
              exit 0
            fi
            if grep -qiE 'handshake|SSLException|SSLHandshake|Could not resolve|Could not GET|Connection reset|Read timed out|maven\.createmod\.net|maven\.ithundxr\.dev' build.log; then
              echo "::warning::attempt ${attempt} hit a dependency transport failure, retrying"
              sleep 30
              continue
            fi
            echo "::error::build failed for a non-transient reason"
            exit 1
          done
          echo "::error::dependency resolution still failing after 3 attempts"
          exit 1

      # Lets a jar be downloaded from any run, and fails loudly if the build somehow
      # reported success without producing one.
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stockkeeperbookmarks
          path: build/libs/*.jar
          if-no-files-found: error
