modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# Top level on purpose: inside [[mods]] this key is silently ignored.
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="icon.png"
displayURL="${mod_url}"
description='''
Replaces the Stock Keeper's single sticky address prompt with a column of
one-click destination buttons. The address field no longer inherits whatever
was typed last, so a stray keystroke can't ship your order to the crusher.

Client-side only — should work on any Minecraft 1.20.1 server running Create.
'''

# Forge spells this "mandatory" where NeoForge uses type="required".
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    # 6.0.0-6.0.6 crash on this loader: the Stock Keeper screen's addressBox field only
    # became the AddressEditBox type this mixin expects in 6.0.3, and 6.0.3-6.0.6 fail
    # for a separate, unresolved reason. Bisected empirically; see DEVELOPMENT.md.
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="CLIENT"
